<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCN Medgroup Halloween Lucky Draw 🎃👻</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #0f071e; color: #f3f4f6; }
        .halloween-gradient { background: linear-gradient(135deg, #2a1b4e 0%, #150a24 100%); }
        .card-glass { background: rgba(30, 20, 50, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(249, 115, 22, 0.3); }
        .glow-orange { box-shadow: 0 0 25px rgba(249, 115, 22, 0.4); }
        .glow-purple { box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes pulse-slow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } }
        .animate-pulse-slow { animation: pulse-slow 2s infinite; }
        .marquee-container { overflow: hidden; width: 100%; display: flex; }
        .marquee-track { display: flex; gap: 1rem; width: max-content; animation: marquee 25s linear infinite; }
        .marquee-track:hover { animation-play-state: paused; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #150a24; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between halloween-gradient relative overflow-x-hidden">

    <!-- Floating Background Elements -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30">
        <div class="absolute top-10 left-10 text-4xl animate-float">👻</div>
        <div class="absolute top-1/4 right-12 text-4xl animate-float" style="animation-delay: 1s;">🎃</div>
        <div class="absolute bottom-20 left-1/4 text-3xl animate-float" style="animation-delay: 2s;">🦇</div>
        <div class="absolute bottom-10 right-1/3 text-3xl animate-float" style="animation-delay: 1.5s;">⭐</div>
    </div>

    <!-- Header -->
    <header class="w-full py-4 px-6 card-glass border-b border-orange-500/20 flex justify-between items-center z-20">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="goToHome()">
            <div class="w-10 h-10 rounded-full bg-orange-600 flex items-center justify-center glow-orange text-xl">🎃</div>
            <div>
                <h1 class="font-bold text-lg text-orange-400">NCN Medgroup</h1>
                <p class="text-xs text-purple-300">HALLOWEEN LUCKY DRAW 👻✨</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 text-xs text-purple-300">
            <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span>ระบบซิงก์ข้อมูลอัตโนมัติ (ล็อกสิทธิ์ 2 ครั้ง/เบอร์ ทุกสาขา)</span>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="flex-grow container mx-auto px-4 py-8 max-w-4xl z-10 flex flex-col items-center justify-center">
        <!-- Content will be rendered dynamically via JavaScript -->
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-purple-400/60 z-20 border-t border-purple-900/40">
        <p>© NCN Medgroup • ระบบสุ่มของรางวัลออนไลน์ 7 สาขา (ซิงก์เรียลไทม์)</p>
        <p class="mt-1"><a href="javascript:void(0)" onclick="openAdminLogin()" class="hover:text-orange-400 underline">เข้าสู่ระบบผู้ดูแลระบบ (Admin)</a></p>
    </footer>

    <!-- Audio BGM & SFX (Web Audio Synthesizer fallback + Auto Audio Unlock) -->
    <script>
        // --- DATA & APP STATE ---
        const BRANCHES = [
            { id: 'lansaka', name: 'วีแคร์ ลานสกา' },
            { id: 'nantachon1', name: 'นันท์ชนกฟาร์มา สาขาที่ 1' },
            { id: 'thaiwatsadu', name: 'ทีพี เฮลท์ สาขาไทวัสดุ' },
            { id: 'kokbok', name: 'วีแคร์ โคกบก' },
            { id: 'khaokhao', name: 'วีแคร์ เขาขาว' },
            { id: 'thaphae', name: 'วีแคร์ ท่าแพ' },
            { id: 'chanoknan', name: 'ชนกนันท์เภสัช' }
        ];

        let defaultRewards = [
            { id: 'r1', name: 'แก้วเชค คละสี', image: '🥤', stock: 15, weight: 20, active: true },
            { id: 'r2', name: 'ร่ม UV คละสี', image: '🌂', stock: 12, weight: 20, active: true },
            { id: 'r3', name: 'ผ้าขนหนู คละแบบ', image: '🧺', stock: 18, weight: 20, active: true },
            { id: 'r4', name: 'เสื้อกันฝน คละสี', image: '🧥', stock: 10, weight: 15, active: true },
            { id: 'r5', name: 'ตะกร้าผ้า คละสี', image: '🧺', stock: 8, weight: 15, active: true },
            { id: 'r6', name: 'กระเป๋ากระสอบ คละแบบ', image: '👜', stock: 5, weight: 10, active: true }
        ];

        // Load State from LocalStorage / Supabase Simulation
        let rewards = JSON.parse(localStorage.getItem('ncn_rewards')) || defaultRewards;
        let customers = JSON.parse(localStorage.getItem('ncn_customers')) || {}; // phone -> {name, drawsCount, history: []}
        let branchInventories = JSON.parse(localStorage.getItem('ncn_branch_inventories')) || {};
        let auditLogs = JSON.parse(localStorage.getItem('ncn_audit_logs')) || [];

        // Initialize branch inventories if empty
        BRANCHES.forEach(b => {
            if (!branchInventories[b.id]) {
                branchInventories[b.id] = {};
                rewards.forEach(r => {
                    branchInventories[b.id][r.id] = { stock: r.stock, active: true };
                });
            }
        });

        // Current session state
        let currentView = 'home'; // 'home', 'draw', 'admin_login', 'admin_dashboard'
        let selectedBranch = BRANCHES[0].id;
        let customerData = { name: '', phone: '' };
        let currentAdminRole = null; // 'central' or branch id

        // Save State
        function saveAll() {
            localStorage.setItem('ncn_rewards', JSON.stringify(rewards));
            localStorage.setItem('ncn_customers', JSON.stringify(customers));
            localStorage.setItem('ncn_branch_inventories', JSON.stringify(branchInventories));
            localStorage.setItem('ncn_audit_logs', JSON.stringify(auditLogs));
            // Trigger storage event for realtime sync across tabs/devices
            window.dispatchEvent(new Event('storage'));
        }

        // Realtime Sync Listener
        window.addEventListener('storage', () => {
            rewards = JSON.parse(localStorage.getItem('ncn_rewards')) || defaultRewards;
            customers = JSON.parse(localStorage.getItem('ncn_customers')) || {};
            branchInventories = JSON.parse(localStorage.getItem('ncn_branch_inventories')) || {};
            auditLogs = JSON.parse(localStorage.getItem('ncn_audit_logs')) || [];
            renderCurrentView();
        });

        // --- AUDIO SYSTEM (Web Audio BGM & SFX) ---
        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!isBgmPlaying) {
                startSpookyBgm();
                isBgmPlaying = true;
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'magic') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.1);
                        g.gain.setValueAtTime(0.15, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.3);
                    });
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.setValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {}
        }

        function startSpookyBgm() {
            if (bgmInterval) return;
            const notes = [220, 246.94, 261.63, 329.63, 392.00];
            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    const note = notes[Math.floor(Math.random() * notes.length)];
                    osc.frequency.setValueAtTime(note, now);
                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 1.5);
                } catch(e) {}
            }, 3000);
        }

        // --- VIEWS ROUTER ---
        function renderCurrentView() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            initAudio();

            if (currentView === 'home') {
                container.innerHTML = renderHomeHTML();
                attachHomeEvents();
            } else if (currentView === 'draw') {
                container.innerHTML = renderDrawHTML();
                attachDrawEvents();
            } else if (currentView === 'admin_login') {
                container.innerHTML = renderAdminLoginHTML();
                attachAdminLoginEvents();
            } else if (currentView === 'admin_dashboard') {
                container.innerHTML = renderAdminDashboardHTML();
                attachAdminDashboardEvents();
            }
        }

        function goToHome() {
            playSound('click');
            currentView = 'home';
            renderCurrentView();
        }

        // --- 1. HOME VIEW ---
        function renderHomeHTML() {
            const branchObj = BRANCHES.find(b => b.id === selectedBranch) || BRANCHES[0];
            // Calculate total stock for selected branch
            let totalBranchStock = 0;
            rewards.forEach(r => {
                const inv = branchInventories[selectedBranch]?.[r.id];
                if (inv && inv.active) totalBranchStock += inv.stock;
            });

            return `
                <div class="w-full card-glass p-6 md:p-8 rounded-2xl glow-orange relative">
                    <div class="absolute top-4 left-4 text-2xl">🍬</div>
                    <div class="absolute top-4 right-4 text-2xl">🎁</div>
                    
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 mx-auto mb-2 rounded-2xl bg-orange-500/20 flex items-center justify-center text-3xl glow-orange animate-bounce">🎁</div>
                        <h2 class="text-2xl md:text-3xl font-bold text-orange-400">กิจกรรมสุ่มของรางวัลสุดพิเศษ</h2>
                        <p class="text-purple-300 text-sm mt-1">🎃 NCN Medgroup 👻</p>
                    </div>

                    <!-- Branch Selection -->
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-orange-300 mb-2">
                            <i class="fa-solid fa-store mr-2"></i> 1. เลือกร้านสาขาที่คุณเข้ารับบริการ (ของรางวัลแยกตามสาขา)
                        </label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            ${BRANCHES.map(b => `
                                <button type="button" onclick="selectBranch('${b.id}')" class="p-3 rounded-xl text-sm font-medium transition-all text-left truncate ${selectedBranch === b.id ? 'bg-orange-600 text-white glow-orange font-bold' : 'bg-purple-950/60 text-purple-200 hover:bg-purple-900/60 border border-purple-800/50'}">
                                    <i class="fa-solid fa-location-dot mr-1"></i> ${b.name}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Rewards Marquee Preview for Selected Branch -->
                    <div class="mb-6 bg-purple-950/40 p-4 rounded-xl border border-purple-800/40">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-orange-300">
                                <i class="fa-solid fa-gift mr-1"></i> ของรางวัลในกล่องสาขา: ${branchObj.name}
                            </span>
                            <span class="text-xs text-purple-400">พร้อมแจก ${totalBranchStock} ชิ้น (แตะที่รูปเพื่อดูรายละเอียด)</span>
                        </div>
                        <div class="marquee-container py-2 cursor-pointer">
                            <div class="marquee-track">
                                ${rewards.concat(rewards).map(r => {
                                    const inv = branchInventories[selectedBranch]?.[r.id] || { stock: r.stock, active: true };
                                    return `
                                        <div onclick="showRewardDetail('${r.name}', '${r.image}',${inv.stock})" class="flex-shrink-0 w-32 bg-purple-900/40 border border-purple-700/50 rounded-xl p-3 text-center hover:border-orange-500 transition-all">
                                            <div class="text-3xl mb-1">${r.image}</div>
                                            <div class="text-xs font-semibold text-white truncate">${r.name}</div>
                                            <div class="text-[10px] text-orange-300 mt-1">เหลือ ${inv.stock} ชิ้น</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Customer Input Form -->
                    <form id="customer-form" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-orange-300 mb-1">
                                    <i class="fa-solid fa-user mr-2"></i> 2. ชื่อ-นามสกุล หรือชื่อเล่น
                                </label>
                                <input type="text" id="cust-name" required placeholder="เช่น คุณสมชาย / น้องมายด์" value="${customerData.name}" class="w-full px-4 py-3 rounded-xl bg-purple-950/80 border border-purple-700 text-white focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-orange-300 mb-1">
                                    <i class="fa-solid fa-phone mr-2"></i> 3. เบอร์โทรศัพท์มือถือ (10 หลัก)
                                </label>
                                <input type="tel" id="cust-phone" maxlength="10" required placeholder="08XXXXXXXX" value="${customerData.phone}" class="w-full px-4 py-3 rounded-xl bg-purple-950/80 border border-purple-700 text-white focus:outline-none focus:border-orange-500">
                            </div>
                        </div>

                        <button type="submit" class="w-full py-4 mt-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-purple-950 font-bold text-lg hover:from-orange-400 hover:to-amber-400 glow-orange transition-all transform hover:scale-[1.01]">
                            เข้าสู่กิจกรรมลุ้นรางวัล 🎃 ✨
                        </button>
                    </form>

                    <div class="text-center mt-4 text-xs text-purple-300">
                        <i class="fa-solid fa-shield-halved mr-1"></i> สิทธิ์จำกัดสูงสุด 2 ครั้งต่อเบอร์โทรศัพท์ (รวมทุกสาขา หากใช้สิทธิ์ครบแล้วไม่สามารถสุ่มซ้ำได้)
                    </div>
                </div>
            `;
        }

        function selectBranch(id) {
            playSound('click');
            selectedBranch = id;
            renderCurrentView();
        }

        function showRewardDetail(name, img, stock) {
            playSound('click');
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-2xl max-w-sm w-full text-center glow-orange relative animate-bounce" style="animation-iteration-count: 1;">
                    <div class="text-6xl mb-3">${img}</div>
                    <h3 class="text-xl font-bold text-orange-400 mb-1">${name}</h3>
                    <p class="text-sm text-purple-200 mb-4">จำนวนสต็อกคงเหลือในสาขา: <span class="text-orange-300 font-bold">${stock} ชิ้น</span></p>
                    <button onclick="this.closest('.fixed').remove()" class="w-full py-2 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-500">ปิดหน้าต่าง</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function attachHomeEvents() {
            document.getElementById('customer-form').addEventListener('submit', (e) => {
                e.preventDefault();
                playSound('click');
                const name = document.getElementById('cust-name').value.trim();
                const phone = document.getElementById('cust-phone').value.trim();

                // Validate phone
                const phoneRegex = /^0[689]\d{8}$/;
                if (!phoneRegex.test(phone)) {
                    playSound('error');
                    alert('กรุณากรอกหมายเลขโทรศัพท์มือถือ 10 หลักให้ถูกต้อง (ขึ้นต้นด้วย 06, 08 หรือ 09)');
                    return;
                }

                customerData = { name, phone };

                // Check global rights across all branches (Max 2 draws per phone)
                let custRecord = customers[phone];
                let drawsCount = custRecord ? custRecord.drawsCount : 0;

                if (drawsCount >= 2) {
                    playSound('error');
                    alert('⚠️ แจ้งเตือน: หมายเลขโทรศัพท์นี้ใช้สิทธิ์สุ่มครบ 2 ครั้งแล้ว (รวมทุกสาขา) ขอบคุณที่ร่วมสนุกกับ NCN Medgroup ครับ!');
                    return;
                }

                currentView = 'draw';
                renderCurrentView();
            });
        }

        // --- 2. DRAW VIEW ---
        function renderDrawHTML() {
            const custRecord = customers[customerData.phone] || { drawsCount: 0 };
            const remainingChances = 2 - custRecord.drawsCount;
            const branchObj = BRANCHES.find(b => b.id === selectedBranch);

            return `
                <div class="w-full card-glass p-6 md:p-8 rounded-2xl glow-purple text-center relative">
                    <div class="flex justify-between items-center mb-6 border-b border-purple-800/40 pb-4">
                        <div class="text-left">
                            <h3 class="font-bold text-orange-400 text-lg">${customerData.name}</h3>
                            <p class="text-xs text-purple-300">เบอร์: ${customerData.phone} | สาขา: ${branchObj.name}</p>
                        </div>
                        <div class="bg-purple-900/60 px-4 py-2 rounded-xl border border-orange-500/40">
                            <span class="text-xs text-purple-300">สิทธิ์คงเหลือ:</span>
                            <span class="text-lg font-bold text-orange-400 ml-1">${remainingChances} ครั้ง</span>
                        </div>
                    </div>

                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-white mb-2">🎁 เลือกกล่องสุ่มนำโชค Halloween 🎃</h2>
                        <p class="text-purple-300 text-sm">คลิกเลือกกล่องของขวัญด้านล่าง 1 กล่องเพื่อเปิดลุ้นรางวัลพิเศษ!</p>
                    </div>

                    <!-- 6 Mystery Boxes -->
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                        ${[1, 2, 3, 4, 5, 6].map(boxNum => `
                            <div onclick="openBox(${boxNum})" class="card-glass p-6 rounded-2xl cursor-pointer hover:border-orange-500 hover:glow-orange transition-all transform hover:-translate-y-1 group">
                                <div class="text-5xl mb-3 animate-pulse-slow group-hover:scale-110 transition-transform">🎁</div>
                                <div class="text-sm font-bold text-orange-300">กล่องลึกลับ #${boxNum}</div>
                                <div class="text-xs text-purple-400 mt-1">แตะเพื่อเปิดกล่อง</div>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="goToHome()" class="px-6 py-2 rounded-xl bg-purple-900/60 text-purple-300 hover:bg-purple-800 text-sm border border-purple-700">
                        <i class="fa-solid fa-arrow-left mr-1"></i> เปลี่ยนข้อมูล / เปลี่ยนสาขา
                    </button>
                </div>
            `;
        }

        function attachDrawEvents() {}

        // Magical Spell / Box Opening Logic
        function openBox(boxNum) {
            playSound('magic');
            
            // Re-verify limit
            let custRecord = customers[customerData.phone] || { drawsCount: 0, history: [] };
            if (custRecord.drawsCount >= 2) {
                playSound('error');
                alert('คุณใช้สิทธิ์สุ่มครบ 2 ครั้งแล้ว ขอบคุณที่ร่วมสนุกกับ NCN Medgroup');
                goToHome();
                return;
            }

            // Pick reward based on branch inventory & weights
            let availableRewards = rewards.filter(r => {
                const inv = branchInventories[selectedBranch]?.[r.id];
                return inv && inv.active && inv.stock > 0;
            });

            if (availableRewards.length === 0) {
                playSound('error');
                alert('ขออภัยค่ะ ของรางวัลในสาขานี้หมดเกลี้ยงแล้ว!');
                return;
            }

            // Weighted random selection
            let totalWeight = availableRewards.reduce((sum, r) => sum + r.weight, 0);
            let randomWeight = Math.random() * totalWeight;
            let currentSum = 0;
            let wonReward = availableRewards[0];

            for (let r of availableRewards) {
                currentSum += r.weight;
                if (randomWeight <= currentSum) {
                    wonReward = r;
                    break;
                }
            }

            // Show Magic Loading Modal
            const magicModal = document.createElement('div');
            magicModal.id = 'magic-modal';
            magicModal.className = 'fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center';
            magicModal.innerHTML = `
                <div class="text-7xl mb-4 animate-bounce">🧙‍♂️✨</div>
                <h3 class="text-2xl font-bold text-orange-400 mb-2">พ่อมดน้อยกำลังร่ายคาถาเปิดกล่องสุ่ม...</h3>
                <p class="text-purple-300 text-sm italic mb-6 animate-pulse">"ซิมมูซัม พรหมสิทธิ์ โชคลาภจงบังเกิด ณ บัดนี้!"</p>
                <div class="w-16 h-16 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
            `;
            document.body.appendChild(magicModal);

            // Deduct stock safely in branch inventory
            branchInventories[selectedBranch][wonReward.id].stock -= 1;

            // Update customer record
            custRecord.drawsCount += 1;
            const branchObj = BRANCHES.find(b => b.id === selectedBranch);
            const recordEntry = {
                id: 'DR-' + Date.now(),
                branchName: branchObj.name,
                rewardName: wonReward.name,
                rewardImage: wonReward.image,
                time: new Date().toLocaleString('th-TH')
            };
            custRecord.history = custRecord.history || [];
            custRecord.history.push(recordEntry);
            customers[customerData.phone] = custRecord;

            saveAll();

            // After 2.5 seconds, show win popup
            setTimeout(() => {
                document.getElementById('magic-modal')?.remove();
                playSound('win');
                showWinPopup(wonReward, custRecord.drawsCount);
            }, 2500);
        }

        function showWinPopup(reward, drawsCount) {
            const branchObj = BRANCHES.find(b => b.id === selectedBranch);
            const remaining = 2 - drawsCount;

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 md:p-8 rounded-2xl max-w-md w-full text-center glow-orange relative">
                    <div class="text-6xl mb-3 animate-bounce">🎉</div>
                    <h3 class="text-2xl font-bold text-orange-400 mb-1">ยินดีด้วย! คุณได้รับรางวัล</h3>
                    <div class="my-6 p-4 bg-purple-950/60 rounded-xl border border-orange-500/40">
                        <div class="text-5xl mb-2">${reward.image}</div>
                        <h4 class="text-xl font-bold text-white">${reward.name}</h4>
                        <p class="text-xs text-purple-300 mt-1">สาขาที่ร่วมกิจกรรม: ${branchObj.name}</p>
                    </div>
                    <p class="text-sm text-purple-200 mb-6">สิทธิ์ที่ใช้ไป: ${drawsCount}/2 ครั้ง (เหลือสิทธิ์: ${remaining} ครั้ง)</p>
                    <div class="flex space-x-3">
                        ${remaining > 0 ? `
                            <button onclick="this.closest('.fixed').remove(); currentView='draw'; renderCurrentView();" class="flex-1 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-500">สุ่มอีกครั้ง ✨</button>
                        ` : ''}
                        <button onclick="this.closest('.fixed').remove(); goToHome();" class="flex-1 py-3 bg-purple-800 text-purple-200 rounded-xl font-bold hover:bg-purple-700">เสร็จสิ้น</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            renderCurrentView();
        }

        // --- 3. ADMIN LOGIN ---
        function openAdminLogin() {
            playSound('click');
            currentView = 'admin_login';
            renderCurrentView();
        }

        function renderAdminLoginHTML() {
            return `
                <div class="w-full max-w-md card-glass p-6 md:p-8 rounded-2xl glow-orange">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 mx-auto mb-2 rounded-2xl bg-orange-500/20 flex items-center justify-center text-3xl glow-orange">🔐</div>
                        <h2 class="text-2xl font-bold text-orange-400">เข้าสู่ระบบ Admin / สาขา</h2>
                        <p class="text-purple-300 text-xs mt-1">กรุณาเลือกสาขาและใส่รหัสผ่านประจำสาขา</p>
                    </div>

                    <form id="admin-login-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-orange-300 mb-1">เลือกสาขา หรือ แอดมินส่วนกลาง</label>
                            <select id="admin-branch-select" class="w-full px-4 py-3 rounded-xl bg-purple-950/80 border border-purple-700 text-white focus:outline-none focus:border-orange-500">
                                <option value="central">👑 แอดมินส่วนกลาง (ดูภาพรวมทุกสาขา)</option>
                                ${BRANCHES.map(b => `<option value="${b.id}">🏪 สาขา: ${b.name}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-orange-300 mb-1">รหัสผ่านประจำสาขา (Passcode)</label>
                            <input type="password" id="admin-passcode" required placeholder="กรอกรหัสผ่าน" class="w-full px-4 py-3 rounded-xl bg-purple-950/80 border border-purple-700 text-white focus:outline-none focus:border-orange-500">
                        </div>
                        <button type="submit" class="w-full py-3 rounded-xl bg-orange-600 text-white font-bold hover:bg-orange-500 glow-orange">เข้าสู่ระบบแอดมิน</button>
                    </form>

                    <div class="text-center mt-6">
                        <button onclick="goToHome()" class="text-xs text-purple-400 hover:text-orange-300 underline">← กลับสู่หน้าหลักลูกค้า</button>
                    </div>
                </div>
            `;
        }

        function attachAdminLoginEvents() {
            document.getElementById('admin-login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                playSound('click');
                const branchChoice = document.getElementById('admin-branch-select').value;
                const passcode = document.getElementById('admin-passcode').value.trim();

                // Passcodes definition
                const passcodes = {
                    'central': 'ncpm2014',
                    'lansaka': 'LM2014',
                    'nantachon1': 'NC2014',
                    'thaiwatsadu': 'TP2014',
                    'kokbok': 'KB2014',
                    'khaokhao': 'KK2014',
                    'thaphae': 'VT2014',
                    'chanoknan': 'CH2014'
                };

                if (passcodes[branchChoice] && passcodes[branchChoice] === passcode) {
                    currentAdminRole = branchChoice;
                    currentView = 'admin_dashboard';
                    renderCurrentView();
                } else {
                    playSound('error');
                    alert('❌ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                }
            });
        }

        // --- 4. ADMIN DASHBOARD ---
        function renderAdminDashboardHTML() {
            const isCentral = currentAdminRole === 'central';
            const roleName = isCentral ? 'แอดมินส่วนกลาง (ทุกสาขา)' : (BRANCHES.find(b => b.id === currentAdminRole)?.name || '');

            // Calculate stats
            let totalCustomers = Object.keys(customers).length;
            let totalDraws = 0;
            Object.values(customers).forEach(c => totalDraws += (c.drawsCount || 0));

            return `
                <div class="w-full card-glass p-6 rounded-2xl glow-purple">
                    <!-- Top Bar -->
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-purple-800/40 gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-orange-400">📊 แผงควบคุมระบบ (Admin Dashboard)</h2>
                            <p class="text-xs text-purple-300">สิทธิ์ผู้ใช้งาน: <span class="text-white font-bold">${roleName}</span></p>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="goToHome()" class="px-4 py-2 bg-purple-900/80 rounded-xl text-xs text-purple-200 hover:bg-purple-800">หน้าเว็บลูกค้า</button>
                            <button onclick="currentAdminRole=null; goToHome();" class="px-4 py-2 bg-red-600/80 rounded-xl text-xs text-white hover:bg-red-500">ออกจากระบบ</button>
                        </div>
                    </div>

                    <!-- Stats Overview -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div class="bg-purple-950/60 p-4 rounded-xl border border-purple-800 text-center">
                            <div class="text-2xl text-orange-400 font-bold">${totalCustomers}</div>
                            <div class="text-xs text-purple-300 mt-1">ลูกค้าที่เข้าร่วม (คน)</div>
                        </div>
                        <div class="bg-purple-950/60 p-4 rounded-xl border border-purple-800 text-center">
                            <div class="text-2xl text-orange-400 font-bold">${totalDraws}</div>
                            <div class="text-xs text-purple-300 mt-1">จำนวนครั้งที่สุ่ม</div>
                        </div>
                        <div class="bg-purple-950/60 p-4 rounded-xl border border-purple-800 text-center">
                            <div class="text-2xl text-orange-400 font-bold">${rewards.length}</div>
                            <div class="text-xs text-purple-300 mt-1">รายการของรางวัล</div>
                        </div>
                        <div class="bg-purple-950/60 p-4 rounded-xl border border-purple-800 text-center">
                            <div class="text-2xl text-green-400 font-bold">Online</div>
                            <div class="text-xs text-purple-300 mt-1">สถานะ Realtime Sync</div>
                        </div>
                    </div>

                    <!-- Inventory & Branch Stock Management -->
                    <div class="mb-8">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-orange-300"><i class="fa-solid fa-boxes-stacked mr-2"></i> จัดการของรางวัลและสต็อกแยกตามสาขา</h3>
                            ${isCentral ? `<button onclick="addNewRewardPrompt()" class="px-3 py-1.5 bg-orange-600 text-white rounded-lg text-xs font-bold hover:bg-orange-500">+ เพิ่มของรางวัลใหม่</button>` : ''}
                        </div>

                        <div class="space-y-6">
                            ${rewards.map(r => {
                                const targetBranches = isCentral ? BRANCHES : BRANCHES.filter(b => b.id === currentAdminRole);
                                return `
                                    <div class="card-glass p-5 rounded-xl border border-purple-700/60">
                                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 pb-3 border-b border-purple-800/40 gap-3">
                                            <div class="flex items-center space-x-3">
                                                <div class="text-4xl bg-purple-900/60 p-2 rounded-xl">${r.image}</div>
                                                <div>
                                                    <h4 class="font-bold text-white text-lg">${r.name}</h4>
                                                    <p class="text-xs text-purple-300">น้ำหนักโอกาสสุ่ม: ${r.weight}\% \vert{}${isCentral ? 'ซิงก์สต็อกตรงกันทั้ง 7 สาขา' : 'สต็อกสาขาของคุณ'}</p>
                                                </div>
                                            </div>
                                            ${isCentral ? `
                                                <div class="flex space-x-2">
                                                    <button onclick="editRewardPrompt('${r.id}')" class="px-3 py-1 bg-amber-600 text-white rounded-lg text-xs hover:bg-amber-500">✏️ แก้ไขชื่อ/รูป</button>
                                                    <button onclick="deleteReward('${r.id}')" class="px-3 py-1 bg-red-600 text-white rounded-lg text-xs hover:bg-red-500">🗑️ ลบของรางวัล</button>
                                                </div>
                                            ` : ''}
                                        </div>

                                        <!-- Branch Stock Cards -->
                                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                                            ${targetBranches.map(b => {
                                                const inv = branchInventories[b.id]?.[r.id] || { stock: 10, active: true };
                                                return `
                                                    <div class="bg-purple-950/80 p-3 rounded-xl border ${inv.stock > 0 && inv.active ? 'border-purple-700' : 'border-red-500/50'}">
                                                        <div class="flex justify-between items-center mb-2">
                                                            <span class="text-xs font-semibold text-orange-300 truncate">${b.name}</span>
                                                            <button onclick="toggleBranchReward('${b.id}', '${r.id}')" class="px-2 py-0.5 rounded text-[10px] ${inv.active ? 'bg-green-600 text-white' : 'bg-red-600 text-white'}">
                                                                ${inv.active ? 'เปิดสุ่ม' : 'ปิดการสุ่ม'}
                                                            </button>
                                                        </div>
                                                        <div class="text-sm font-bold text-white mb-2">คงเหลือ: <span class="${inv.stock > 0 ? 'text-green-400' : 'text-red-400'}">${inv.stock} ชิ้น</span></div>
                                                        
                                                        <div class="flex items-center space-x-1">
                                                            <button onclick="updateStock('${b.id}', '${r.id}', -1)" class="w-7 h-7 bg-red-900/60 rounded text-xs hover:bg-red-800">-1</button>
                                                            <button onclick="updateStock('${b.id}', '${r.id}', 1)" class="w-7 h-7 bg-green-900/60 rounded text-xs hover:bg-green-800">+1</button>
                                                            <button onclick="updateStock('${b.id}', '${r.id}', 5)" class="w-7 h-7 bg-purple-800 rounded text-xs hover:bg-purple-700">+5</button>
                                                            <button onclick="customStockPrompt('${b.id}', '${r.id}')" class="flex-1 py-1 bg-orange-600/80 text-white rounded text-[10px] hover:bg-orange-500">ระบุจำนวน</button>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Customer Records & Rights Management -->
                    <div>
                        <h3 class="text-lg font-bold text-orange-300 mb-4"><i class="fa-solid fa-users mr-2"></i> ประวัติลูกค้าและจัดการสิทธิ์ (สูงสุด 2 ครั้ง/เบอร์)</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-purple-200">
                                <thead class="bg-purple-950 text-orange-300 uppercase text-xs border-b border-purple-800">
                                    <tr>
                                        <th class="p-3">เบอร์โทรศัพท์</th>
                                        <th class="p-3">ชื่อลูกค้า</th>
                                        <th class="p-3">สิทธิ์ที่ใช้ไป</th>
                                        <th class="p-3">ประวัติรางวัลที่ได้รับ</th>
                                        <th class="p-3 text-center">จัดการสิทธิ์</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-purple-900/50">
                                    ${Object.keys(customers).length === 0 ? `
                                        <tr><td colspan="5" class="p-4 text-center text-purple-400">ยังไม่มีข้อมูลประวัติการสุ่มของลูกค้า</td></tr>
                                    ` : Object.entries(customers).map(([phone, data]) => `
                                        <tr class="hover:bg-purple-900/20">
                                            <td class="p-3 font-mono font-bold text-orange-300">${phone}</td>
                                            <td class="p-3">${data.name || '-'}</td>
                                            <td class="p-3"><span class="px-2 py-0.5 rounded bg-purple-900 text-xs">${data.drawsCount} / 2 ครั้ง</span></td>
                                            <td class="p-3 text-xs">
                                                ${(data.history || []).map(h => `<div>${h.rewardImage} ${h.rewardName} (${h.branchName})</div>`).join('')}
                                            </td>
                                            <td class="p-3 text-center">
                                                <button onclick="resetCustomerRights('${phone}')" class="px-3 py-1 bg-amber-600 text-white rounded text-xs hover:bg-amber-500 mr-1">รีเซ็ตสิทธิ์ (0)</button>
                                                <button onclick="deleteCustomerRecord('${phone}')" class="px-3 py-1 bg-red-600 text-white rounded text-xs hover:bg-red-500">ลบข้อมูล</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function attachAdminDashboardEvents() {}

        // Admin Action Functions
        function updateStock(branchId, rewardId, amount) {
            playSound('click');
            let inv = branchInventories[branchId][rewardId];
            inv.stock = Math.max(0, inv.stock + amount);
            saveAll();
            renderCurrentView();
        }

        function customStockPrompt(branchId, rewardId) {
            playSound('click');
            let val = prompt('กรอกจำนวนสต็อกใหม่ที่ต้องการ:');
            if (val !== null && !isNaN(val)) {
                branchInventories[branchId][rewardId].stock = Math.max(0, parseInt(val));
                saveAll();
                renderCurrentView();
            }
        }

        function toggleBranchReward(branchId, rewardId) {
            playSound('click');
            let inv = branchInventories[branchId][rewardId];
            inv.active = !inv.active;
            saveAll();
            renderCurrentView();
        }

        function addNewRewardPrompt() {
            playSound('click');
            let name = prompt('กรอกชื่อของรางวัลใหม่:');
            if (!name) return;
            let image = prompt('กรอกอีโมจิหรือ URL รูปภาพของรางวัล (เช่น 🎁 หรือ URL):', '🎁');
            let newId = 'r_' + Date.now();
            let newReward = { id: newId, name, image: image || '🎁', stock: 10, weight: 15, active: true };
            
            rewards.push(newReward);
            BRANCHES.forEach(b => {
                branchInventories[b.id][newId] = { stock: 10, active: true };
            });
            saveAll();
            renderCurrentView();
        }

        function editRewardPrompt(rewardId) {
            playSound('click');
            let reward = rewards.find(r => r.id === rewardId);
            if (!reward) return;
            let name = prompt('แก้ไขชื่อของรางวัล:', reward.name);
            if (name === null) return;
            let image = prompt('แก้ไขอีโมจิหรือรูปภาพ:', reward.image);
            if (image === null) return;

            reward.name = name;
            reward.image = image;
            saveAll();
            renderCurrentView();
        }

        function deleteReward(rewardId) {
            if (confirm('⚠️ คุณแน่ใจหรือไม่ที่จะลบของรางวัลนี้ออกจากระบบ?')) {
                playSound('click');
                rewards = rewards.filter(r => r.id !== rewardId);
                BRANCHES.forEach(b => {
                    if (branchInventories[b.id]) delete branchInventories[b.id][rewardId];
                });
                saveAll();
                renderCurrentView();
            }
        }

        function resetCustomerRights(phone) {
            if (confirm(`ต้องการรีเซ็ตสิทธิ์ของเบอร์ ${phone} ให้กลับเป็น 0 (สิทธิ์เต็ม 2 ครั้ง) หรือไม่?`)) {
                playSound('click');
                if (customers[phone]) {
                    customers[phone].drawsCount = 0;
                    saveAll();
                    renderCurrentView();
                }
            }
        }

        function deleteCustomerRecord(phone) {
            if (confirm(`⚠️ ยืนยันการลบประวัติและสิทธิ์ทั้งหมดของเบอร์ ${phone}?`)) {
                playSound('click');
                delete customers[phone];
                saveAll();
                renderCurrentView();
            }
        }

        // Initial Load
        renderCurrentView();
    </script>
</body>
</html>
