<!DOCTYPE html>
<html lang="th">
<head>

    <script>
        const SUPABASE_URL = 'https://stbzvohtzmifwjfaocli.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8EOHwzGLMz5pHVpKPyN9og_NQDH0WzN';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #0f071e; color: #f3f4f6; }
        .halloween-gradient { background: linear-gradient(135deg, #2a1b4e 0%, #150a24 100%); }
        .card-glass { background: rgba(30, 20, 50, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(249, 115, 22, 0.3); }
        .glow-orange { box-shadow: 0 0 25px rgba(249, 115, 22, 0.4); }
        .glow-purple { box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes pulse-slow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } }
        .animate-pulse-slow { animation: pulse-slow 2s infinite; }
        .marquee-container { overflow: hidden; width: 100%; display: flex; }
        .marquee-track { display: flex; gap: 1rem; width: max-content; animation: marquee 25s linear infinite; }
        .marquee-track:hover { animation-play-state: paused; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #150a24; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between halloween-gradient relative overflow-x-hidden">

    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30">
        <div class="absolute top-10 left-10 text-4xl animate-float">👻</div>
        <div class="absolute top-1/4 right-12 text-4xl animate-float" style="animation-delay: 1s;">🎃</div>
        <div class="absolute bottom-20 left-1/4 text-3xl animate-float" style="animation-delay: 2s;">🦇</div>
        <div class="absolute bottom-10 right-1/3 text-3xl animate-float" style="animation-delay: 1.5s;">⭐</div>
    </div>

    <header class="w-full py-4 px-6 card-glass border-b border-orange-500/20 flex justify-between items-center z-20">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="goToHome()">
            <div class="w-10 h-10 rounded-full bg-orange-600 flex items-center justify-center glow-orange text-xl">🎃</div>
            <div>
                <h1 class="font-bold text-lg text-orange-400">NCN Medgroup</h1>
                <p class="text-xs text-purple-300">HALLOWEEN LUCKY DRAW 👻✨</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 text-xs text-purple-300">
            <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span>ระบบซิงก์คลาวด์ Supabase Realtime</span>
        </div>
    </header>

    <main id="app-container" class="flex-grow container mx-auto px-4 py-8 max-w-4xl z-10 flex flex-col items-center justify-center">
        <div class="text-center text-orange-400 text-xl animate-pulse">กำลังโหลดข้อมูลจากคลาวด์... 🎃</div>
    </main>

    <footer class="w-full py-4 text-center text-xs text-purple-400/60 z-20 border-t border-purple-900/40">
        <p>© NCN Medgroup • ระบบสุ่มของรางวัลออนไลน์ 7 สาขา (ซิงก์เรียลไทม์)</p>
        <p class="mt-1"><a href="javascript:void(0)" onclick="openAdminLogin()" class="hover:text-orange-400 underline">เข้าสู่ระบบผู้ดูแลระบบ (Admin)</a></p>
    </footer>

    <script>
        const BRANCHES = [
            { id: 'lansaka', name: 'วีแคร์ ลานสกา' },
            { id: 'nantachon1', name: 'นันท์ชนกฟาร์มา สาขาที่ 1' },
            { id: 'thaiwatsadu', name: 'ทีพี เฮลท์ สาขาไทวัสดุ' },
            { id: 'kokbok', name: 'วีแคร์ โคกบก' },
            { id: 'khaokhao', name: 'วีแคร์ เขาขาว' },
            { id: 'thaphae', name: 'วีแคร์ ท่าแพ' },
            { id: 'chanoknan', name: 'ชนกนันท์เภสัช' }
        ];

        let defaultRewards = [
            { id: 'r1', name: 'แก้วเชค คละสี', image: '🥤', weight: 20 },
            { id: 'r2', name: 'ร่ม UV คละสี', image: '🌂', weight: 20 },
            { id: 'r3', name: 'ผ้าขนหนู คละแบบ', image: '🧺', weight: 20 },
            { id: 'r4', name: 'เสื้อกันฝน คละสี', image: '🧥', weight: 15 },
            { id: 'r5', name: 'ตะกร้าผ้า คละสี', image: '🧺', weight: 15 },
            { id: 'r6', name: 'กระเป๋ากระสอบ คละแบบ', image: '👜', weight: 10 }
        ];

        let rewards = [];
        let branchInventories = {};
        let customers = JSON.parse(localStorage.getItem('ncn_customers')) || {};

        let currentView = 'home';
        let selectedBranch = BRANCHES[0].id;
        let customerData = { name: '', phone: '' };
        let currentAdminRole = null;

        // Load data from Supabase
        async function loadSupabaseData() {
            try {
                let { data, error } = await supabaseClient.from('rewards').select('*');
                if (error) throw error;

                if (!data || data.length === 0) {
                    // Seed initial data if empty
                    for (let r of defaultRewards) {
                        let stock_map = {};
                        let active_map = {};
                        BRANCHES.forEach(b => {
                            stock_map[b.id] = 15;
                            active_map[b.id] = true;
                        });
                        await supabaseClient.from('rewards').insert({
                            id: r.id,
                            name: r.name,
                            image: r.image,
                            stock_map: stock_map,
                            active_map: active_map
                        });
                    }
                    let res = await supabaseClient.from('rewards').select('*');
                    data = res.data;
                }

                rewards = data.map(r => ({
                    id: r.id,
                    name: r.name,
                    image: r.image,
                    weight: 15
                }));

                branchInventories = {};
                BRANCHES.forEach(b => {
                    branchInventories[b.id] = {};
                    data.forEach(r => {
                        const sMap = r.stock_map || {};
                        const aMap = r.active_map || {};
                        branchInventories[b.id][r.id] = {
                            stock: sMap[b.id] !== undefined ? sMap[b.id] : 10,
                            active: aMap[b.id] !== undefined ? aMap[b.id] : true
                        };
                    });
                });

                renderCurrentView();
            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

        // Realtime Subscription
        supabaseClient
            .channel('public:rewards')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'rewards' }, payload => {
                loadSupabaseData();
            })
            .subscribe();

        async function saveRewardToSupabase(rewardId) {
            const reward = rewards.find(r => r.id === rewardId);
            if (!reward) return;

            let stock_map = {};
            let active_map = {};
            BRANCHES.forEach(b => {
                stock_map[b.id] = branchInventories[b.id]?.[rewardId]?.stock ?? 10;
                active_map[b.id] = branchInventories[b.id]?.[rewardId]?.active ?? true;
            });

            await supabaseClient.from('rewards').upsert({
                id: reward.id,
                name: reward.name,
                image: reward.image,
                stock_map: stock_map,
                active_map: active_map
            });
        }

        async function saveAllToSupabase() {
            for (let r of rewards) {
                await saveRewardToSupabase(r.id);
            }
            localStorage.setItem('ncn_customers', JSON.stringify(customers));
        }

        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!isBgmPlaying) {
                startSpookyBgm();
                isBgmPlaying = true;
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'magic') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.1);
                        g.gain.setValueAtTime(0.15, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.3);
                    });
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.setValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {}
        }

        function startSpookyBgm() {
            if (bgmInterval) return;
            const notes = [220, 246.94, 261.63, 329.63, 392.00];
            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    const note = notes[Math.floor(Math.random() * notes.length)];
                    osc.frequency.setValueAtTime(note, now);
                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 1.5);
                } catch(e) {}
            }, 3000);
        }

        function renderCurrentView() {
            const container = document.getElementById('app-container');
            if (!container) return;
            container.innerHTML = '';
            initAudio();

            if (currentView === 'home') {
                container.innerHTML = renderHomeHTML();
                attachHomeEvents();
            } else if (currentView === 'draw') {
                container.innerHTML = renderDrawHTML();
                attachDrawEvents();
            } else if (currentView === 'admin_login') {
                container.innerHTML = renderAdminLoginHTML();
                attachAdminLoginEvents();
            } else if (currentView === 'admin_dashboard') {
                container.innerHTML = renderAdminDashboardHTML();
                attachAdminDashboardEvents();
            }
        }

        function goToHome() {
            playSound('click');
            currentView = 'home';
            renderCurrentView();
        }

        function renderHomeHTML() {
            const branchObj = BRANCHES.find(b => b.id === selectedBranch) || BRANCHES[0];
            let totalBranchStock = 0;
            rewards.forEach(r => {
                const inv = branchInventories[selectedBranch]?.[r.id];
                if (inv && inv.active) totalBranchStock += inv.stock;
            });

            return `
                <div class="w-full card-glass p-6 md:p-8 rounded-2xl glow-orange relative">
                    <div class="absolute top-4 left-4 text-2xl">🍬</div>
                    <div class="absolute top-4 right-4 text-2xl">🎁</div>
                    
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 mx-auto mb-2 rounded-2xl bg-orange-500/20 flex items-center justify-center text-3xl glow-orange animate-bounce">🎁</div>
                        <h2 class="text-2xl md:text-3xl font-bold text-orange-400">กิจกรรมสุ่มของรางวัลสุดพิเศษ</h2>
                        <p class="text-purple-300 text-sm mt-1">🎃 NCN Medgroup 👻</p>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-orange-300 mb-2">
                            <i class="fa-solid fa-store mr-2"></i> 1. เลือกร้านสาขาที่คุณเข้ารับบริการ (ของรางวัลแยกตามสาขา)
                        </label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            ${BRANCHES.map(b => `
                                <button type="button" onclick="selectBranch('${b.id}')" class="p-3 rounded-xl text-sm font-medium transition-all text-left truncate ${selectedBranch === b.id ? 'bg-orange-600 text-white glow-orange font-bold' : 'bg-purple-950/60 text-purple-200 hover:bg-purple-900/60 border border-purple-800/50'}">
                                    <i class="fa-solid fa-location-dot mr-1"></i> ${b.name}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="mb-6 bg-purple-950/40 p-4 rounded-xl border border-purple-800/40">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-orange-300">
                                <i class="fa-solid fa-gift mr-1"></i> ของรางวัลในกล่องสาขา: ${branchObj.name}
                            </span>
                            <span class="text-xs text-purple-400">พร้อมแจก ${totalBranchStock} ชิ้น (แตะที่รูปเพื่อดูรายละเอียด)</span>
                        </div>
                        <div class="marquee-container py-2 cursor-pointer">
                            <div class="marquee-track">
                                ${rewards.concat(rewards).map(r => {
                                    const inv = branchInventories[selectedBranch]?.[r.id] || { stock: 10, active: true };
                                    const isImg = typeof r.image === 'string' && r.image.startsWith('data:image');
                                    return `
                                        <div onclick="showRewardDetail('${r.name}', '${r.image}', ${inv.stock})" class="flex-shrink-0 w-32 bg-purple-900/40 border border-purple-700/50 rounded-xl p-3 text-center hover:border-orange-500 transition-all">
                                            <div class="text-3xl mb-1 flex items-center justify-center h-10">
                                                ${isImg ? `<img src="${r.image}" class="w-10 h-10 object-cover rounded-lg">` : r.image}
                                            </div>
                                            <div class="text-xs font-semibold text-white truncate">${r.name}</div>
                                            <div class="text-[10px] text-orange-300 mt-1">เหลือ ${inv.stock} ชิ้น</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>

                    <form id="customer-form" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-orange-300 mb-1">
                                    <i class="fa-solid fa-user mr-2"></i> 2. ชื่อ-นามสกุล หรือชื่อเล่น
                                </label>
                                <input type="text" id="cust-name" required placeholder="เช่น คุณสมชาย / น้องมายด์" value="${customerData.name}" class="w-full px-4 py-3 rounded-xl bg-purple-950/80 border border-purple-700 text-white focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-orange-300 mb-1">
                                    <i class="fa-solid fa-phone mr-2"></i> 3. เบอร์โทรศัพท์มือถือ (10 หลัก)
                                </label>
                                <input type="tel" id="cust-phone" maxlength="10" required placeholder="08XXXXXXXX" value="${customerData.phone}" class="w-full px-4 py-3 rounded-xl bg-purple-950/80 border border-purple-700 text-white focus:outline-none focus:border-orange-500">
                            </div>
                        </div>

                        <button type="submit" class="w-full py-4 mt-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-purple-950 font-bold text-lg hover:from-orange-400 hover:to-amber-400 glow-orange transition-all transform hover:scale-[1.01]">
                            เข้าสู่กิจกรรมลุ้นรางวัล 🎃 ✨
                        </button>
                    </form>

                    <div class="text-center mt-4 text-xs text-purple-300">
                        <i class="fa-solid fa-shield-halved mr-1"></i> สิทธิ์จำกัดสูงสุด 2 ครั้งต่อเบอร์โทรศัพท์ (รวมทุกสาขา หากใช้สิทธิ์ครบแล้วไม่สามารถสุ่มซ้ำได้)
                    </div>
                </div>
            `;
        }

        function selectBranch(id) {
            playSound('click');
            selectedBranch = id;
            renderCurrentView();
        }

        function showRewardDetail(name, img, stock) {
            playSound('click');
            const isImg = typeof img === 'string' && img.startsWith('data:image');
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-2xl max-w-sm w-full text-center glow-orange relative">
                    <div class="text-6xl mb-3 flex items-center justify-center h-20">
                        ${isImg ? `<img src="${img}" class="w-20 h-20 object-cover rounded-xl shadow-lg">` : img}
                    </div>
                    <h3 class="text-xl font-bold text-orange-400 mb-1">${name}</h3>
                    <p class="text-sm text-purple-200 mb-4">จำนวนสต็อกคงเหลือในสาขา: <span class="text-orange-300 font-bold">${stock} ชิ้น</span></p>
                    <button onclick="this.closest('.fixed').remove()" class="w-full py-2 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-500">ปิดหน้าต่าง</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function attachHomeEvents() {
            const form = document.getElementById('customer-form');
            if (!form) return;
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                playSound('click');
                const name = document.getElementById('cust-name').value.trim();
                const phone = document.getElementById('cust-phone').value.trim();

                const phoneRegex = /^0[689]\d{8}$/;
                if (!phoneRegex.test(phone)) {
                    playSound('error');
                    alert('กรุณากรอกหมายเลขโทรศัพท์มือถือ 10 หลักให้ถูกต้อง (ขึ้นต้นด้วย 06, 08 หรือ 09)');
                    return;
                }

                customerData = { name, phone };

                let custRecord = customers[phone];
                let drawsCount = custRecord ? custRecord.drawsCount : 0;

                if (drawsCount >= 2) {
                    playSound('error');
                    alert('⚠️ แจ้งเตือน: หมายเลขโทรศัพท์นี้ใช้สิทธิ์สุ่มครบ 2 ครั้งแล้ว (รวมทุกสาขา) ขอบคุณที่ร่วมสนุกกับ NCN Medgroup ครับ!');
                    return;
                }

                currentView = 'draw';
                renderCurrentView();
            });
        }

        function renderDrawHTML() {
            const custRecord = customers[customerData.phone] || { drawsCount: 0 };
            const remainingChances = 2 - custRecord.drawsCount;
            const branchObj = BRANCHES.find(b => b.id === selectedBranch);

            return `
                <div class="w-full card-glass p-6 md:p-8 rounded-2xl glow-purple text-center relative">
                    <div class="flex justify-between items-center mb-6 border-b border-purple-800/40 pb-4">
                        <div class="text-left">
                            <h3 class="font-bold text-orange-400 text-lg">${customerData.name}</h3>
                            <p class="text-xs text-purple-300">เบอร์: ${customerData.phone} \vert{} สาขา: ${branchObj.name}</p>
                        </div>
                        <div class="bg-purple-900/60 px-4 py-2 rounded-xl border border-orange-500/40">
                            <span class="text-xs text-purple-300">สิทธิ์คงเหลือ:</span>
                            <span class="text-lg font-bold text-orange-400 ml-1">${remainingChances} ครั้ง</span>
                        </div>
                    </div>

                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-white mb-2">🎁 เลือกกล่องสุ่มนำโชค Halloween 🎃</h2>
                        <p class="text-purple-300 text-sm">คลิกเลือกกล่องของขวัญด้านล่าง 1 กล่องเพื่อเปิดลุ้นรางวัลพิเศษ!</p>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                        ${[1, 2, 3, 4, 5, 6].map(boxNum => `
                            <div onclick="openBox(${boxNum})" class="card-glass p-6 rounded-2xl cursor-pointer hover:border-orange-500 hover:glow-orange transition-all transform hover:-translate-y-1 group">
                                <div class="text-5xl mb-3 animate-pulse-slow group-hover:scale-110 transition-transform">🎁</div>
                                <div class="text-sm font-bold text-orange-300">กล่องลึกลับ #${boxNum}</div>
                                <div class="text-xs text-purple-400 mt-1">แตะเพื่อเปิดกล่อง</div>
                            </div>
                        `).join('')}
                    </div>

        async function openBox(boxNum) {
            playSound('magic');
            
            let custRecord = customers[customerData.phone] || { drawsCount: 0, history: [] };
            if (custRecord.drawsCount >= 2) {
                playSound('error');
                alert('คุณใช้สิทธิ์สุ่มครบ 2 ครั้งแล้ว ขอบคุณที่ร่วมสนุกกับ NCN Medgroup');
                goToHome();
                return;
            }

            let availableRewards = rewards.filter(r => {
                const inv = branchInventories[selectedBranch]?.[r.id];
                return inv && inv.active && inv.stock > 0;
            });

            if (availableRewards.length === 0) {
                playSound('error');
                alert('ขออภัยค่ะ ของรางวัลในสาขานี้หมดเกลี้ยงแล้ว!');
                return;
            }

            let totalWeight = availableRewards.reduce((sum, r) => sum + r.weight, 0);
            let randomWeight = Math.random() * totalWeight;
            let currentSum = 0;
            let wonReward = availableRewards[0];

            for (let r of availableRewards) {
                currentSum += r.weight;
                if (randomWeight <= currentSum) {
                    wonReward = r;
                    break;
                }
            }

            const magicModal = document.createElement('div');
            magicModal.id = 'magic-modal';
            magicModal.className = 'fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center';
            magicModal.innerHTML = `
                <div class="text-7xl mb-4 animate-bounce">🧙‍♂️✨</div>
                <h3 class="text-2xl font-bold text-orange-400 mb-2">พ่อมดน้อยกำลังร่ายคาถาเปิดกล่องสุ่ม...</h3>
                <p class="text-purple-300 text-sm italic mb-6 animate-pulse">"ซิมมูซัม พรหมสิทธิ์ โชคลาภจงบังเกิด ณ บัดนี้!"</p>
                <div class="w-16 h-16 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
            `;
            document.body.appendChild(magicModal);

            branchInventories[selectedBranch][wonReward.id].stock -= 1;
            await saveRewardToSupabase(wonReward.id);

            custRecord.drawsCount += 1;
            const branchObj = BRANCHES.find(b => b.id === selectedBranch);
            const recordEntry = {
                id: 'DR-' + Date.now(),
                branchName: branchObj.name,
                rewardName: wonReward.name,
                rewardImage: wonReward.image,
                time: new Date().toLocaleString('th-TH')
            };
            custRecord.history = custRecord.history || [];
            custRecord.history.push(recordEntry);
            customers[customerData.phone] = custRecord;
            localStorage.setItem('ncn_customers', JSON.stringify(customers));

            setTimeout(() => {
                document.getElementById('magic-modal')?.remove();
                playSound('win');
                showWinPopup(wonReward, custRecord.drawsCount);
            }, 2500);
        }
