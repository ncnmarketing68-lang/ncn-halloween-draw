        body { font-family: 'Sarabun', sans-serif; background-color: #0f071e; color: #f3f4f6; }

    <script>

            { id: 'kokbok', name: 'วีแคร์ โคกบก' },
            { id: 'khaokhao', name: 'วีแคร์ เขาขาว' },
            { id: 'thaphae', name: 'วีแคร์ ท่าแพ' },

        const defaultRewards = [

        let rewards = JSON.parse(localStorage.getItem('ncn_rewards_cache')) || defaultRewards;

        BRANCHES.forEach(b => {
            if (!branchInventories[b.id]) branchInventories[b.id] = {};

        let customers = JSON.parse(localStorage.getItem('ncn_customers')) || {};

        // 3. ระบบเสียง
        function initAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (!isBgmPlaying) { startSpookyBgm(); isBgmPlaying = true; }
            } catch (e) {}
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'magic') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now); osc.stop(now + 0.6);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.1);
                        g.gain.setValueAtTime(0.15, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                        o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.3);
                    });
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.setValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                }
            } catch (e) {}
        }

        function startSpookyBgm() {
            if (bgmInterval) return;
            const notes = [220, 246.94, 261.63, 329.63, 392.00];
            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    const note = notes[Math.floor(Math.random() * notes.length)];
                    osc.frequency.setValueAtTime(note, now);
                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 1.5);
                } catch (e) {}
            }, 3000);
        }

        // 4. บีบอัดรูปภาพ
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 250;
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                    } else {
                        if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 5. โหลดข้อมูล Supabase
        async function loadSupabaseData() {
            if (!supabaseClient) return;
            try {
                let { data, error } = await supabaseClient.from('rewards').select('*');
                if (error) return;

                if (!data || data.length === 0) {
                    const seedRows = defaultRewards.map(r => {
                        let stock_map = {}, active_map = {};
                        BRANCHES.forEach(b => {
                            stock_map[b.id] = 15;
                            active_map[b.id] = true;
                        });
                        return { id: r.id, name: r.name, image: r.image, stock_map, active_map };
                    });
                    await supabaseClient.from('rewards').upsert(seedRows);
                    let res = await supabaseClient.from('rewards').select('*');
                    data = res.data;
                }

                if (data && data.length > 0) {
                    rewards = data.map(r => ({
                        id: r.id, name: r.name, image: r.image, weight: 15
                    }));
                    branchInventories = {};
                    BRANCHES.forEach(b => {
                        branchInventories[b.id] = {};
                        data.forEach(r => {
                            const sMap = r.stock_map || {};
                            const aMap = r.active_map || {};
                            branchInventories[b.id][r.id] = {
                                stock: sMap[b.id] !== undefined ? sMap[b.id] : 15,
                                active: aMap[b.id] !== undefined ? aMap[b.id] : true
                            };
                        });
                    });
                    localStorage.setItem('ncn_rewards_cache', JSON.stringify(rewards));
                    localStorage.setItem('ncn_inv_cache', JSON.stringify(branchInventories));
                    renderCurrentView();
                }
            } catch (err) {
                console.error('Supabase load error:', err);
            }
        }

        async function saveRewardToSupabase(rewardId) {
            localStorage.setItem('ncn_rewards_cache', JSON.stringify(rewards));
            localStorage.setItem('ncn_inv_cache', JSON.stringify(branchInventories));
            if (!supabaseClient) return;

            const reward = rewards.find(r => r.id === rewardId);
            if (!reward) return;

            let stock_map = {}, active_map = {};
            BRANCHES.forEach(b => {
                stock_map[b.id] = branchInventories[b.id]?.[rewardId]?.stock ?? 15;
                active_map[b.id] = branchInventories[b.id]?.[rewardId]?.active ?? true;
            });

            try {
                await supabaseClient.from('rewards').upsert({
                    id: reward.id, name: reward.name, image: reward.image, stock_map, active_map
                });
            } catch (err) {
                console.error('Supabase save error:', err);
            }
        }

        if (supabaseClient) {
            supabaseClient
                .channel('public:rewards')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rewards' }, () => {
                    loadSupabaseData();
                })
                .subscribe();
        }

        // 6. เรนเดอร์หน้าจอพร้อมระบบป้องกันข้อผิดพลาด
        function renderCurrentView() {
            const container = document.getElementById('app-container');
            if (!container) return;

            try {
                if (currentView === 'home') {
                    container.innerHTML = renderHomeHTML();
                    attachHomeEvents();
                } else if (currentView === 'draw') {
                    container.innerHTML = renderDrawHTML();
                } else if (currentView === 'admin_login') {
                    container.innerHTML = renderAdminLoginHTML();
                    attachAdminLoginEvents();
                } else if (currentView === 'admin_dashboard') {
                    container.innerHTML = renderAdminDashboardHTML();
                }
            } catch (err) {
                console.error("Render Error:", err);
                container.innerHTML = `<div class="card-glass p-6 rounded-2xl text-center text-red-400">เกิดข้อผิดพลาดในการแสดงผล: ${err.message}</div>`;
            }
        }

        function goToHome() {
            playSound('click');
            currentView = 'home';
            renderCurrentView();
        }

            return `

                    <div class="absolute top-4 left-4 text-2xl">🍬</div>
                    <div class="absolute top-4 right-4 text-2xl">🎁</div>
                    
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 mx-auto mb-2 rounded-2xl bg-orange-500/20 flex items-center justify-center text-3xl glow-orange animate-bounce">🎁</div>
                        <h2 class="text-2xl md:text-3xl font-bold text-orange-400">กิจกรรมสุ่มของรางวัลสุดพิเศษ</h2>
                        <p class="text-purple-300 text-sm mt-1">🎃 NCN Medgroup 👻</p>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-orange-300 mb-2">
                            <i class="fa-solid fa-store mr-2"></i> 1. เลือกร้านสาขาที่คุณเข้ารับบริการ (ของรางวัลแยกตามสาขา)
                        </label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            ${BRANCHES.map(b => `
                                <button type="button" onclick="selectBranch('${b.id}')" class="p-3 rounded-xl text-sm font-medium transition-all text-left truncate ${selectedBranch === b.id ? 'bg-orange-600 text-white glow-orange font-bold' : 'bg-purple-950/60 text-purple-200 hover:bg-purple-900/60 border border-purple-800/50'}">

                                </button>

                    </div>

                    <div class="mb-6 bg-purple-950/40 p-4 rounded-xl border border-purple-800/40">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-orange-300">
                                <i class="fa-solid fa-gift mr-1"></i> ของรางวัลในกล่องสาขา: ${branchObj.name}

                            <span class="text-xs text-purple-400">พร้อมแจก ${totalBranchStock} ชิ้น (แตะที่รูปเพื่อดูรายละเอียด)</span>
                        </div>
                        <div class="marquee-container py-2 cursor-pointer">
                            <div class="marquee-track">
                                ${(rewards || []).concat(rewards || []).map(r => {
                                    const inv = branchInventories[selectedBranch]?.[r.id] || { stock: 15, active: true };
                                    const isImg = typeof r.image === 'string' && r.image.startsWith('data:image');
                                    return `
                                        <div onclick="showRewardDetail('${r.id}')" class="flex-shrink-0 w-32 bg-purple-900/40 border border-purple-700/50 rounded-xl p-3 text-center hover:border-orange-500 transition-all">

                                                ${isImg ? `<img src="${r.image}" class="w-10 h-10 object-cover rounded-lg">` : r.image}

                        <button type="submit" class="w-full py-4 mt-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-purple-950 font-bold text-lg hover:from-orange-400 hover:to-amber-400 glow-orange transition-all transform hover:scale-[1.01]">
                            เข้าสู่กิจกรรมลุ้นรางวัล 🎃 ✨

                    <div class="text-center mt-4 text-xs text-purple-300">

        }

        function selectBranch(id) {
            playSound('click');
            selectedBranch = id;
            renderCurrentView();
        }

        function showRewardDetail(rewardId) {
            playSound('click');
            const r = rewards.find(item => item.id === rewardId);
            if (!r) return;
            const inv = branchInventories[selectedBranch]?.[r.id] || { stock: 15 };
            const isImg = typeof r.image === 'string' && r.image.startsWith('data:image');
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-2xl max-w-sm w-full text-center glow-orange relative">
                    <div class="text-6xl mb-3 flex items-center justify-center h-24">

                    <p class="text-sm text-purple-200 mb-4">จำนวนสต็อกคงเหลือในสาขา: <span class="text-orange-300 font-bold">${inv.stock} ชิ้น</span></p>
                    <button onclick="this.closest('.fixed').remove()" class="w-full py-2 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-500">ปิดหน้าต่าง</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function attachHomeEvents() {
            const form = document.getElementById('customer-form');
            if (!form) return;
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                playSound('click');
                const name = document.getElementById('cust-name').value.trim();
                const phone = document.getElementById('cust-phone').value.trim();

                const phoneRegex = /^0[689]\d{8}$/;
                if (!phoneRegex.test(phone)) {
                    playSound('error');
                    alert('กรุณากรอกหมายเลขโทรศัพท์มือถือ 10 หลักให้ถูกต้อง (ขึ้นต้นด้วย 06, 08 หรือ 09)');
                    return;
                }

                customerData = { name, phone };
                let custRecord = customers[phone];
                let drawsCount = custRecord ? custRecord.drawsCount : 0;

                if (drawsCount >= 2) {
                    playSound('error');
                    alert('⚠️ แจ้งเตือน: หมายเลขโทรศัพท์นี้ใช้สิทธิ์สุ่มครบ 2 ครั้งแล้ว (รวมทุกสาขา) ขอบคุณที่ร่วมสนุกกับ NCN Medgroup ครับ!');
                    return;
                }

                currentView = 'draw';
                renderCurrentView();
            });
        }

        function renderDrawHTML() {

        async function openBox(boxNum) {
            playSound('magic');
            
            let custRecord = customers[customerData.phone] || { name: customerData.name, drawsCount: 0, history: [] };
            if (custRecord.drawsCount >= 2) {
                playSound('error');
                alert('คุณใช้สิทธิ์สุ่มครบ 2 ครั้งแล้ว ขอบคุณที่ร่วมสนุกกับ NCN Medgroup');
                goToHome();
                return;
            }

            let availableRewards = rewards.filter(r => {
                const inv = branchInventories[selectedBranch]?.[r.id];
                return inv && inv.active && inv.stock > 0;
            });

            if (availableRewards.length === 0) {
                playSound('error');
                alert('ขออภัยค่ะ ของรางวัลในสาขานี้หมดเกลี้ยงแล้ว!');
                return;
            }

            let totalWeight = availableRewards.reduce((sum, r) => sum + (r.weight || 15), 0);
            let randomWeight = Math.random() * totalWeight;
            let currentSum = 0;
            let wonReward = availableRewards[0];

            for (let r of availableRewards) {
                currentSum += (r.weight || 15);
                if (randomWeight <= currentSum) {
                    wonReward = r;
                    break;
                }
            }

            const magicModal = document.createElement('div');
            magicModal.id = 'magic-modal';
            magicModal.className = 'fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center';
            magicModal.innerHTML = `
                <div class="text-7xl mb-4 animate-bounce">🧙‍♂️✨</div>
                <h3 class="text-2xl font-bold text-orange-400 mb-2">พ่อมดน้อยกำลังร่ายคาถาเปิดกล่องสุ่ม...</h3>
                <p class="text-purple-300 text-sm italic mb-6 animate-pulse">"ซิมมูซัม พรหมสิทธิ์ โชคลาภจงบังเกิด ณ บัดนี้!"</p>
                <div class="w-16 h-16 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
            `;
            document.body.appendChild(magicModal);

            branchInventories[selectedBranch][wonReward.id].stock -= 1;
            await saveRewardToSupabase(wonReward.id);

            custRecord.name = customerData.name;
            custRecord.drawsCount += 1;
            const branchObj = BRANCHES.find(b => b.id === selectedBranch);
            const isImg = typeof wonReward.image === 'string' && wonReward.image.startsWith('data:image');
            const recordEntry = {
                id: 'DR-' + Date.now(),
                branchName: branchObj.name,
                rewardName: wonReward.name,
                rewardImage: isImg ? '🎁' : wonReward.image,
                time: new Date().toLocaleString('th-TH')
            };
            custRecord.history = custRecord.history || [];
            custRecord.history.push(recordEntry);
            customers[customerData.phone] = custRecord;
            localStorage.setItem('ncn_customers', JSON.stringify(customers));

            setTimeout(() => {
                document.getElementById('magic-modal')?.remove();
                playSound('win');
                showWinPopup(wonReward, custRecord.drawsCount);
            }, 2000);
        }

                                    <input type="file" id="modal-file-input" accept="image/*" class="w-full text-xs text-purple-300 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-500 cursor-pointer">
                                </div>
                            </div>
                            <input type="text" id="modal-emoji-input" value="${!isImg ? reward.image : ''}" placeholder="หรือใส่อีโมจิ เช่น 🎁" class="w-full px-3 py-2 rounded-xl bg-purple-950 border border-purple-700 text-white text-xs focus:outline-none focus:border-orange-500">
                        </div>

                        <div class="flex space-x-2 pt-2">
                            <button id="modal-save-btn" class="flex-1 py-2.5 bg-orange-600 text-white font-bold rounded-xl text-sm hover:bg-orange-500">บันทึกและซิงก์</button>
                            <button id="modal-cancel-btn" class="flex-1 py-2.5 bg-purple-900 text-purple-200 font-bold rounded-xl text-sm hover:bg-purple-800">ยกเลิก</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const fileInput = modal.querySelector('#modal-file-input');
            const emojiInput = modal.querySelector('#modal-emoji-input');
            const preview = modal.querySelector('#modal-preview');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    compressImage(file, (compressedDataUrl) => {
                        tempImage = compressedDataUrl;
                        preview.innerHTML = `<img src="${tempImage}" class="w-full h-full object-cover">`;
                        emojiInput.value = '';
                    });
                }
            });

            emojiInput.addEventListener('input', (e) => {
                if (e.target.value.trim() !== '') {
                    tempImage = e.target.value.trim();
                    preview.innerHTML = tempImage;
                    fileInput.value = '';
                }
            });

            modal.querySelector('#modal-save-btn').addEventListener('click', async () => {
                const newName = modal.querySelector('#modal-reward-name').value.trim();
                if (!newName) {
                    alert('กรุณากรอกชื่อของรางวัล');
                    return;
                }
                reward.name = newName;
                reward.image = tempImage;
                modal.remove();
                renderCurrentView();
                await saveRewardToSupabase(reward.id);
            });

            modal.querySelector('#modal-cancel-btn').addEventListener('click', () => {
                modal.remove();
            });
        }

        function addNewRewardModal() {
            playSound('click');
            let tempImage = '🎁';

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-2xl max-w-md w-full glow-orange">
                    <h3 class="text-xl font-bold text-orange-400 mb-4"><i class="fa-solid fa-plus-circle mr-2"></i> เพิ่มของรางวัลใหม่</h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-orange-300 mb-1">ชื่อของรางวัล</label>
                            <input type="text" id="modal-reward-name" placeholder="เช่น กระเป๋าผ้าพรีเมียม" class="w-full px-4 py-2 rounded-xl bg-purple-950 border border-purple-700 text-white text-sm focus:outline-none focus:border-orange-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-orange-300 mb-1">อัปโหลดรูปภาพจากคอมพิวเตอร์ หรือใส่อีโมจิ</label>
                            <div class="flex items-center space-x-3 mb-2">
                                <div id="modal-preview" class="w-16 h-16 bg-purple-900 rounded-xl flex items-center justify-center text-3xl overflow-hidden border border-orange-500/40">🎁</div>
                                <div class="flex-1">
                                    <input type="file" id="modal-file-input" accept="image/*" class="w-full text-xs text-purple-300 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-500 cursor-pointer">
                                </div>
                            </div>
                            <input type="text" id="modal-emoji-input" placeholder="หรือใส่อีโมจิ เช่น 🎁" class="w-full px-3 py-2 rounded-xl bg-purple-950 border border-purple-700 text-white text-xs focus:outline-none focus:border-orange-500">
                        </div>

                        <div class="flex space-x-2 pt-2">
                            <button id="modal-save-btn" class="flex-1 py-2.5 bg-orange-600 text-white font-bold rounded-xl text-sm hover:bg-orange-500">เพิ่มของรางวัล</button>
                            <button id="modal-cancel-btn" class="flex-1 py-2.5 bg-purple-900 text-purple-200 font-bold rounded-xl text-sm hover:bg-purple-800">ยกเลิก</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const fileInput = modal.querySelector('#modal-file-input');
            const emojiInput = modal.querySelector('#modal-emoji-input');
            const preview = modal.querySelector('#modal-preview');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    compressImage(file, (compressedDataUrl) => {
                        tempImage = compressedDataUrl;
                        preview.innerHTML = `<img src="${tempImage}" class="w-full h-full object-cover">`;
                        emojiInput.value = '';
                    });
                }
            });

            emojiInput.addEventListener('input', (e) => {
                if (e.target.value.trim() !== '') {
                    tempImage = e.target.value.trim();
                    preview.innerHTML = tempImage;
                    fileInput.value = '';
                }
            });

            modal.querySelector('#modal-save-btn').addEventListener('click', async () => {
                const name = modal.querySelector('#modal-reward-name').value.trim();
                if (!name) {
                    alert('กรุณากรอกชื่อของรางวัล');
                    return;
                }
                let newId = 'r_' + Date.now();
                let newReward = { id: newId, name, image: tempImage, weight: 15 };
                
                rewards.push(newReward);
                BRANCHES.forEach(b => {
                    if (!branchInventories[b.id]) branchInventories[b.id] = {};
                    branchInventories[b.id][newId] = { stock: 15, active: true };
                });

                modal.remove();
                renderCurrentView();
                await saveRewardToSupabase(newId);
            });

            modal.querySelector('#modal-cancel-btn').addEventListener('click', () => {
                modal.remove();
            });
        }

        async function deleteReward(rewardId) {
            if (confirm('⚠️ คุณแน่ใจหรือไม่ที่จะลบของรางวัลนี้ออกจากระบบ?')) {
                playSound('click');
                rewards = rewards.filter(r => r.id !== rewardId);
                localStorage.setItem('ncn_rewards_cache', JSON.stringify(rewards));
                renderCurrentView();
                if (supabaseClient) {
                    await supabaseClient.from('rewards').delete().eq('id', rewardId);
                }
            }
        }

        function resetCustomerRights(phone) {
            if (confirm(`ต้องการรีเซ็ตสิทธิ์ของเบอร์ ${phone} ให้กลับเป็น 0 (สิทธิ์เต็ม 2 ครั้ง) หรือไม่?`)) {
                playSound('click');
                if (customers[phone]) {
                    customers[phone].drawsCount = 0;
                    localStorage.setItem('ncn_customers', JSON.stringify(customers));
                    renderCurrentView();
                }
            }
        }

        function deleteCustomerRecord(phone) {
            if (confirm(`⚠️ ยืนยันการลบประวัติและสิทธิ์ทั้งหมดของเบอร์ ${phone}?`)) {
                playSound('click');
                delete customers[phone];
                localStorage.setItem('ncn_customers', JSON.stringify(customers));
                renderCurrentView();
            }
        }

        // 7. เริ่มต้นการทำงานทันที
        renderCurrentView();
        loadSupabaseData();
    </script>
</body>
